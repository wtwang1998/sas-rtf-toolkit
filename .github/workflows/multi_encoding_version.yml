name: multi_encoding_converter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**.sas"
      - "multi_encoding_converter.py"
      - ".github/workflows/multi_encoding_version.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash -e {0}

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify checked-out PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The checked-out commit does not match the PR head from this event."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Run converter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python multi_encoding_converter.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Reject fork PR write-back
        if: ${{ steps.check_changes.outputs.has_changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Automatic encoding sync can only push to PR branches in this repository. Apply the generated copies in the fork branch manually."
          exit 1

      - name: Commit and push changes
        if: ${{ steps.check_changes.outputs.has_changed == 'true' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add src/gbk src/utf8 src/utf16 src/gb18030
          git commit -m "chore: multi encoding version"
          git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF"
